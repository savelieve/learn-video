name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build-and-release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build .skill artifact
        run: |
          bash skills/learn-video/scripts/build-skill.sh
          test -f dist/learn-video.skill

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/learn-video.skill
          generate_release_notes: true
          draft: false
          prerelease: false
